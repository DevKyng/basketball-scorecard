<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball ScoreCard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scoreboard">
       
        <div class="team">
        <h1>HOME</h1>
        <div class="score" id="home-score">0</div>
        <button onclick="updateHomeScore(1)" id="home-plus-one">+1</button>
        <button onclick="updateHomeScore(2)" id="home-plus-two">+2</button>
        <button  onclick="updateHomeScore(3)" id="home-plus-three">+3</button>
    </div>
     <button onclick="resetScores()" id="reset-button">Reset</button>
    

    <div class="team">
        <h1>GUEST</h1>
        <div class="score" id="guest-score">0</div>
        <button onclick="updateGuestScore(1)" id="guest-plus-one">+1</button>
        <button onclick="updateGuestScore(2)" id="guest-plus-two">+2</button>
        <button onclick="updateGuestScore(3)" id="guest-plus-three">+3</button>
    </div>


    <script src="script.js"></script>
</body>
</html>
